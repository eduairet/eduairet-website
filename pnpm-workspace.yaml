# pnpm settings — see https://pnpm.io/settings

autoInstallPeers: true
nodeLinker: hoisted

# Skip versions newer than 7 days; compromised releases are usually pulled within a day or two.
minimumReleaseAge: 10080

# No dependency may run install scripts; adding one here is the review step that stops a malicious postinstall.
onlyBuiltDependencies: []

# esbuild ships prebuilt binaries as optional deps, so its install script is not needed.
ignoredBuiltDependencies:
  - esbuild
