# pnpm settings — see https://pnpm.io/settings

# Supply-chain "cooldown": refuse to install any package version that was
# published less than this many minutes ago. Compromised npm releases are
# almost always detected and unpublished within a day or two, so waiting a few
# days before a new version becomes installable keeps freshly poisoned versions
# out of both installs and the lockfile. 10080 minutes = 7 days.
minimumReleaseAge: 10080

# Lifecycle-script lockdown. pnpm blocks package build/postinstall scripts by
# default; this makes that explicit and reviewable. An empty allowlist means NO
# dependency may run install scripts. If a dependency legitimately needs to
# build, add it here deliberately (that is the review checkpoint that stops a
# malicious postinstall from running silently).
onlyBuiltDependencies: []

# Known packages we intentionally do NOT build. esbuild ships prebuilt platform
# binaries via optional deps, so its install script is unnecessary here; listing
# it documents the decision and silences the approval prompt.
ignoredBuiltDependencies:
  - esbuild
