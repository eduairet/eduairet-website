# pnpm settings — see https://pnpm.io/settings

autoInstallPeers: true
nodeLinker: hoisted

# The Alpine dev container runs on the host's node_modules, so install its musl
# binaries from the lockfile instead of letting Next download them unverified.
supportedArchitectures:
  os: [current, linux]
  cpu: [current]
  libc: [current, musl]

# Skip versions newer than 7 days; compromised releases are usually pulled within a day or two.
minimumReleaseAge: 10080

# No dependency may run install scripts; adding one here is the review step that stops a malicious postinstall.
onlyBuiltDependencies: []

# Only the sass CLI's --watch uses it, and it pulls in braces (GHSA-vfj7-8cjw-p6xm, no fix).
ignoredOptionalDependencies:
  - '@parcel/watcher'

# esbuild ships prebuilt binaries as optional deps, so its install script is not needed.
ignoredBuiltDependencies:
  - esbuild
