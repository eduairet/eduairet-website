name: Vercel Preview Deployment

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# Triggered by the push, not by Tests: a workflow_run trigger deploys the default branch.
on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**/*.md'
      - '_docs/**'
      - '__tests__/**'
      - '.github/dependabot.yml'
      - '.github/workflows/production.yml'
      - '.github/workflows/tests.yml'

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Deploy-Preview:
    # Dependabot runs read Dependabot secrets, not Actions secrets, so
    # VERCEL_TOKEN is empty and the Vercel CLI exits before it deploys.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Install pnpm
        run: npm install --global pnpm@10.24.0
      - name: Install Vercel CLI
        run: npm install --global vercel@65.2.0
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
