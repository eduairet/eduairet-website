name: Tests

permissions:
  contents: read

env:
  GMAIL: ${{ secrets.GMAIL }}
  GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
  NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
  RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
  NEXT_PUBLIC_TYPEKIT: ${{ secrets.NEXT_PUBLIC_TYPEKIT }}

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Build test image
        run: |
          docker build -t eduairet-website-test .
      - name: Run tests in Docker
        run: |
          docker run --rm \
            -e GMAIL="$GMAIL" \
            -e GMAIL_PASSWORD="$GMAIL_PASSWORD" \
            -e NEXT_PUBLIC_RECAPTCHA_SITE_KEY="$NEXT_PUBLIC_RECAPTCHA_SITE_KEY" \
            -e RECAPTCHA_SECRET_KEY="$RECAPTCHA_SECRET_KEY" \
            -e NEXT_PUBLIC_TYPEKIT="$NEXT_PUBLIC_TYPEKIT" \
            eduairet-website-test pnpm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Enable pnpm via Corepack
        run: corepack enable
      - name: Audit production dependencies (critical — blocking)
        # Hard-fail the build if anything that ships to visitors has a critical
        # advisory. Reads pnpm-lock.yaml only — no install, so no build scripts
        # run.
        run: pnpm audit --prod --audit-level=critical
      - name: Audit report (high and below — non-blocking)
        # Surface the remaining advisories (mostly ReDoS-class issues in build
        # tooling) for visibility without wedging deploys on issues that have no
        # safe patch path yet.
        run: pnpm audit || true
