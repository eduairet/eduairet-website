name: Tests

permissions:
  contents: read

env:
  GMAIL: ${{ secrets.GMAIL }}
  GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
  NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
  RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
  NEXT_PUBLIC_TYPEKIT: ${{ secrets.NEXT_PUBLIC_TYPEKIT }}

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build test image
        run: |
          docker build -t eduairet-website-test .
      - name: Run tests in Docker
        run: |
          docker run --rm \
            -e GMAIL="$GMAIL" \
            -e GMAIL_PASSWORD="$GMAIL_PASSWORD" \
            -e NEXT_PUBLIC_RECAPTCHA_SITE_KEY="$NEXT_PUBLIC_RECAPTCHA_SITE_KEY" \
            -e RECAPTCHA_SECRET_KEY="$RECAPTCHA_SECRET_KEY" \
            -e NEXT_PUBLIC_TYPEKIT="$NEXT_PUBLIC_TYPEKIT" \
            eduairet-website-test pnpm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable pnpm via Corepack
        run: corepack enable
      - name: Audit production dependencies (critical, blocking)
        # Reads pnpm-lock.yaml only, so no package code runs.
        run: pnpm audit --prod --audit-level=critical
      - name: Audit report (high and below, non-blocking)
        # Visible, but doesn't block deploys on advisories with no safe patch yet.
        run: pnpm audit || true
